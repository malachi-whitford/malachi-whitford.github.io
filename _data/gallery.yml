# Photo sections on the Videos & Photos page (/videos/).
#
# HOW TO ADD PHOTOS: upload them into one of the folders in images/gallery/.
# That's it. They show up in that folder's section automatically.
#   images/gallery/research/
#   images/gallery/nature/
#   images/gallery/students-in-the-field/
#
# HOW TO ADD A NEW SECTION: create a new folder in images/gallery/
# (e.g. images/gallery/conservation-club/) and upload photos into it.
# The section title comes from the folder name ("Conservation Club").
#
# The list below only sets the ORDER of sections on the page.
# Folders not listed here still show up, after these.

order:
  - research
  - nature
  - students-in-the-field
